name: Beautiful Jekyll CI

# Build-only job, so no write access is required.
permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    name: Build Jekyll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          # Track the Ruby version at https://pages.github.com/versions/
          ruby-version: '3.3.4'
          bundler-cache: true

      - name: Build the site
        run: bundle exec jekyll build --future
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: ${{ github.repository }}
